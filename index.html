<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gaussian Splat Viewer — Arunika Office</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d13;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e2e8f0;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        /* HUD Layer */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Title Badge */
        #title-badge {
            align-self: flex-start;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
        }

        #title-badge h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #title-badge .tag {
            background: rgba(59, 130, 246, 0.25);
            color: #60a5fa;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        #title-badge .model-name {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Controls Navigation Hint */
        #controls-hint {
            align-self: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            padding: 8px 18px;
            font-size: 12px;
            color: #94a3b8;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            gap: 14px;
            align-items: center;
        }

        #controls-hint span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        #controls-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Centered Loading Overlay */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 13, 19, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            pointer-events: auto;
        }

        .loading-card {
            background: rgba(23, 28, 43, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 36px 44px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        #spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 20px auto;
            border: 3px solid rgba(96, 165, 250, 0.15);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 6px;
        }

        .loading-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 9999px;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #status-text {
            font-size: 13px;
            color: #cbd5e1;
            font-variant-numeric: tabular-nums;
        }

        /* Error Overlay */
        #error-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 13, 19, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
        }

        .error-card {
            background: rgba(30, 20, 25, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 20px;
            padding: 36px 40px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        }

        .error-icon {
            font-size: 38px;
            margin-bottom: 16px;
            display: inline-block;
        }

        .error-title {
            font-size: 19px;
            font-weight: 600;
            color: #fca5a5;
            margin-bottom: 10px;
        }

        #error-message {
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 24px;
            word-break: break-word;
        }

        #retry-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        #retry-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        #retry-btn:active {
            transform: translateY(1px);
        }

        .mesh-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transform: translateY(-40px);
            /* Push the button cleanly ABOVE the object pivot point */
        }
    </style>
</head>

<body>
    <!-- HUD Layer -->
    <div id="hud">
        <div id="title-badge">
            <h1>
                <span>Gaussian Splat</span>
                <span class="tag">WebGPU</span>
            </h1>
            <div class="model-name">Arunika Office</div>
        </div>
        <div id="controls-hint">
            <span><kbd>Left Click</kbd> Rotate</span>
            <span><kbd>Right Click</kbd> Pan</span>
            <span><kbd>Scroll</kbd> Zoom</span>
        </div>
    </div>

    <!-- Centered Loading Overlay -->
    <div id="loading-overlay">
        <div class="loading-card">
            <div id="spinner"></div>
            <div class="loading-title">Loading 3D Scene</div>
            <div class="loading-subtitle">Fetching and unpacking Gaussian Splat data</div>
            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>
            <div id="status-text">Initializing WebGPU renderer...</div>
        </div>
    </div>

    <!-- Error Overlay -->
    <div id="error-overlay">
        <div class="error-card">
            <div class="error-icon">⚠️</div>
            <div class="error-title">Viewer Initialization Error</div>
            <div id="error-message"></div>
            <button id="retry-btn">Reload Page</button>
        </div>
    </div>

    <script type="module" src="./public/main.js"></script>
</body>

</html>
